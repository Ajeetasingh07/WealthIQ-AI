<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthIQ AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #64748b;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }

        .section {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>WealthIQ AI</h1>
    <p>AI-Powered Personal Finance Dashboard</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Total Income</h3>
            <div class="value" id="income">Loading...</div>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <div class="value" id="expenses">Loading...</div>
        </div>

        <div class="card">
            <h3>Current Balance</h3>
            <div class="value" id="balance">Loading...</div>
        </div>

        <div class="card">
            <h3>Predicted Spending</h3>
            <div class="value" id="forecast">Loading...</div>
        </div>

    </div>

    <div class="section">
        <h2>Budget Recommendation</h2>
        <p id="budget">Loading...</p>
    </div>

    <div class="section">
        <h2>Top Spending Category</h2>
        <p id="category">Loading...</p>
    </div>

</div>

<script>

async function loadDashboard() {

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/dashboard"
        );

        const data = await response.json();

        document.getElementById("income").textContent =
            "₹" + data.total_income.toLocaleString();

        document.getElementById("expenses").textContent =
            "₹" + data.total_expenses.toLocaleString();

        document.getElementById("balance").textContent =
            "₹" + data.balance.toLocaleString();

        document.getElementById("forecast").textContent =
            "₹" + data.predicted_spending.toLocaleString();

        document.getElementById("budget").textContent =
            "Recommended Budget: ₹" +
            data.recommended_budget.toLocaleString() +
            " | Status: " +
            data.budget_status;

        document.getElementById("category").textContent =
            data.top_category +
            " — ₹" +
            data.top_category_amount.toLocaleString();

    } catch (error) {

        console.error("Unable to connect to WealthIQ API:", error);

    }

}

loadDashboard();

</script>

</body>
</html>
